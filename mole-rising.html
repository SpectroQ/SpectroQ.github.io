function scubaSpread(base){
  const pend=[];for(let r=Math.max(0,base-SCUBA_GAP);r<base+20;r++){const w=world[r];if(!w)continue;for(let c=0;c<W;c++)if(w.arm[c]===1){pend.push([w,r,c]);w.arm[c]=2}}

}

function dbgAct(a){

  else if(a==='dmk'){makePocket();toggleDbg();return}

  else if(a==='gye'){if(geyNow&&geyNow.st===1)geyErupt(geyNow);else toast('NO WARNING RUNNING','#FF8A70');toggleDbg();return}
  else if(a==='gyr'){const L=Math.floor(M.y/20);S.geyDone[L]=0;S.geyRearm=L;S.geyWait=0;toast('GEYSER RE-ARMED (LV '+(L+1)+')','#FF7A3A');toggleDbg();return}
  else if(a==='gyx'){S.noGeyser=!S.noGeyser}
  else if(a[0]==='g'&&a!=='god'){if(a==='gall'){[1,2,3,4].forEach(k=>grant(k))}else if(a==='gclr'){M.tS=M.tC=M.tG=0;M.armour=false;colorOn=false}else grant(+a[1])}
  else if(a==='jg')jumpTo(FIN_ROW-40);
  else if(a==='ja'){jumpTo(FIN_ROW-6);toggleDbg();return}
  else if(a==='jf'){jumpTo(FIN_ROW+4);const w=world[SUMMIT-1];w.t[3]=EMPTY;w.s[3]=0;w.rub[3]=0;M.y=SUMMIT-1;camB=M.y*T+T/2-GH*.25;lavaTop=Math.max(camB+28,(M.y-8)*T);toggleDbg();return}
  else if(a[0]==='j')jumpTo(+a.slice(1));
  else if(a[0]==='l'&&a.length<4)S.lavaMul=+a.slice(1);
  else if(a==='rock'){ensure(M.y+8);const c=M.x,r=M.y+3;for(let rr=M.y+1;rr<=r;rr++)world[rr].t[c]=EMPTY;world[r].t[c]=ROCK;world[r].s[c]=0;world[r].emb[c]=0;for(const cc of[c-1,c+1])if(cc>=0&&cc<W&&world[r].t[cc]===ROCK)world[r].t[cc]=DIRT;falls.set(r*W+c,{c,r,t:.5,w:true});toggleDbg()}
  else if(a==='lavaz'){lavaTop=M.y*T+5;toggleDbg()}
  else if(a==='god'){S.god=!S.god}
  else if(a==='perm'){S.perm=!S.perm;if(M){for(const k of['tS','tC','tG'])if(M[k]>0)M[k]=S.perm?1e9:(k==='tG'?GLASSES_SECONDS:POWER_SECONDS)}}
  else if(a==='dark'){S.noDark=!S.noDark}
  else if(a==='mir'){S.mirror=!S.mirror}
  else if(a==='hint'){swirlSeen=0;try{localStorage.setItem('moleRisingSwirl',0)}catch(e){}}
  else if(a==='die'){if(state==='play'){toggleDbg();die()}}
  else if(a==='rst'){newGame();toggleDbg();return}
  buildDbg()}

// ===================================================== level verification (used by the headless test: MR.verify)
// v0.7.1: water shapes must never leave a sealed pocket (a void/water cell that no route reaches) or a river exit that opens onto bedrock/water/void
function waterCheck(base){let sealed=0,badExit=0,exits=0;const rows=[];for(let i=0;i<20;i++)rows.push(world[base+i]);
  const seen=new Uint8Array(20*W),q=[];const pass=(i,c)=>rows[i].t[c]!==SOLID;
  for(const i of [0,19])for(let c=0;c<W;c++)if(pass(i,c)&&!seen[i*W+c]){seen[i*W+c]=1;q.push([i,c])}
  while(q.length){const [i,c]=q.pop();for(const [dc,di] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,ni=i+di;if(nc<0||nc>=W||ni<0||ni>=20||seen[ni*W+nc]||!pass(ni,nc))continue;seen[ni*W+nc]=1;q.push([ni,nc])}}
  for(let i=0;i<20;i++)for(let c=0;c<W;c++){const t=rows[i].t[c];if((t===EMPTY||t===WATER)&&!seen[i*W+c])sealed++;
    if(t===WATER&&rows[i].vf[c]===0){exits++;const up=world[base+i+1];const tu=up?up.t[c]:DIRT;if(!(tu===EMPTY||tu===DIRT||tu===ROCK))badExit++}}
  return{sealed,badExit,exits}}
function scubaAudit(){   // v1.0 patch verifier: no water vein/river has more than ONE scuba (real pickup, or armour pickup that converts to scuba) near it, and no two scuba candidates are closer than SCUBA_GAP rows
  const cand=[];const wr=[];
  for(let r=0;r<world.length;r++){const w=world[r];if(!w)continue;let hasW=false;for(let c=0;c<W;c++){if(isScuba(w,c))cand.push([r,c,w.arm[c]===1?'conv':'real']);if(w.t[c]===WATER)hasW=true}wr.push(hasW)}
  const bodies=[];for(let r=0;r<wr.length;r++)if(wr[r]){let b=r;while(b+1<wr.length&&wr[b+1])b++;bodies.push([r,b]);r=b}
  let over=0,none=0,after=0,maxIn=0,close=0;
  for(const [t,b] of bodies){const inn=cand.filter(x=>x[0]>=t-SCUBA_GAP&&x[0]<=b);maxIn=Math.max(maxIn,inn.length);if(inn.length>1)over++;if(!inn.length)none++;if(inn.some(x=>x[0]>b))after++}
  for(let i=1;i<cand.length;i++)if(cand[i][0]-cand[i-1][0]<SCUBA_GAP)close++;
  return{scubaVeins:bodies.length,scubaOver:over,scubaMaxIn:maxIn,scubaNone:none,scubaClose:close,scubaCands:cand.length,scubaConv:cand.filter(x=>x[2]==='conv').length}}
function gearAudit(){   // v1.0 patch verifier: every level that contains claws-only HARD rock has a claws pickup the mole can reach WITHOUT passing a HARD cell; every twin (boulder-pillar) vault has claws beside it
  let hardLv=0,noClaws=0,twins=0,twinNoClaws=0;
  for(let L=0;L*20+19<world.length&&L<20;L++){const base=L*20;let hard=false;for(let i=0;i<20;i++){const w=world[base+i];if(!w)continue;for(let c=0;c<W;c++)if(w.t[c]===HARD)hard=true}
    const pl=((S.genLog||[])[L]||{}).plan||[];
    if(hard){hardLv++;const seen=new Set(),q=[];for(let c=0;c<W;c++){const t=world[base].t[c];if(t!==SOLID&&t!==HARD){seen.add(c);q.push([c,0])}}let found=false;
      while(q.length&&!found){const [c,i]=q.pop();const w=world[base+i];if(w.loot[c]===2&&!w.arm[c]){found=true;break}
        for(const [dc,di] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,ni=i+di;if(nc<0||nc>=W||ni<0||ni>19)continue;const k=ni*W+nc;if(seen.has(k))continue;const t=world[base+ni].t[nc];if(t===SOLID||t===HARD||world[base+ni].fog[nc])continue;seen.add(k);q.push([nc,ni])}}
      if(!found)noClaws++}
    if(pl.includes('v:twin')){twins++;let f=false;for(let i=0;i<20;i++)for(let c=0;c<W;c++){const w=world[base+i];if(w.loot[c]===2&&!w.arm[c])f=true}if(!f)twinNoClaws++}}
  return{gearHardLevels:hardLv,gearNoClaws:noClaws,gearTwins:twins,gearTwinNoClaws:twinNoClaws}}
function chamberAudit(){   // v1.0 patch verifier: (1) glasses ONLY inside dark vault chambers (never open, also never via armour conversion); (2) no glasses in a one-way chamber (twin); (3) every glasses chamber has a way out (dirt/rock only, no hard rock, no bedrock) and the reward cell is not under a collapsing boulder
  let glasses=0,open=0,armGlasses=0,oneWay=0,noExit=0,twinDrill=0,twinOther=0,underRock=0;
  for(let r=0;r<world.length;r++){const w=world[r];if(!w)continue;for(let c=0;c<W;c++){
    if(w.arm[c]===4)armGlasses++;
    if(w.loot[c]===4){glasses++;if(!w.fog[c])open++;
      const L=Math.floor(r/20),pl=((S.genLog||[])[L]||{}).plan||[];if(pl.includes('v:twin'))oneWay++;
      const id=w.fog[c],seen=new Set([r*W+c]),q=[[c,r]];let out=false;
      while(q.length&&!out){const [x,y]=q.pop();for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dc,ny=y+dr;if(nx<0||nx>=W||ny<0||!world[ny])continue;const k=ny*W+nx;if(seen.has(k))continue;const t=world[ny].t[nx];
        if(t!==EMPTY&&t!==DIRT&&t!==ROCK&&t!==HARD)continue;seen.add(k);if(world[ny].fog[nx]===id)q.push([nx,ny]);else if(!vaultAt.has(k)||vaultAt.get(k)!==id){out=true;break}else q.push([nx,ny])}}

  for(let L=0;L*20+19<world.length&&L<20;L++){const pl=((S.genLog||[])[L]||{}).plan||[];if(pl.includes('v:twin')){let d=false;for(let i=0;i<20;i++){const w=world[L*20+i];for(let c=0;c<W;c++)if(w.loot[c]===5)d=true}if(!d){twinOther++;(S.chDbg=S.chDbg||[]).push([L,S.seed,S.genLog[L].tries,S.lastDrillL])}}}
  return{chGlasses:glasses,chOpenGlasses:open,chArmGlasses:armGlasses,chOneWayGlasses:oneWay,chNoExit:noExit,chTwinDrill:twinDrill,chTwinNoDrill:twinOther,chUnderRock:underRock}}

    for(let L=0;L<nLevels;L++){if(L>=20){if(L===20){const ac=arenaCheck();{const uf=unfairRocks(FIN_ROW);stats.unfair=(stats.unfair||0)+uf.bad}stats.levels++;if(!ac.ok){stats.fail++;stats.failures.push({s,L,ac})}}continue}
